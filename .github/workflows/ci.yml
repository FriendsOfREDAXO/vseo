name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Syntax check
        run: find . -name '*.php' -not -path './.git/*' -not -path './.github/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: vseo
      # REDAXO-Core (mit den Core-AddOns cronjob und phpmailer) und YRewrite nur für die Symbole
      - uses: actions/checkout@v4
        with:
          repository: redaxo/redaxo
          ref: '5.x'
          path: redaxo
      - uses: actions/checkout@v4
        with:
          repository: FriendsOfREDAXO/yrewrite
          path: yrewrite
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: phpstan:2
      - name: Analyse
        working-directory: vseo
        run: phpstan analyse -c .github/phpstan/phpstan.neon --no-progress --memory-limit=1G
