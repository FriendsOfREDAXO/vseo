package: vseo
version: '1.0.0-beta1'
author: VIEWSION
supportpage: https://github.com/viewsion/vseo

page:
    title: translate:vseo_title
    perm: vseo[]
    icon: rex-icon fa-line-chart
    pjax: false
    subpages:
        overview:
            title: translate:vseo_overview
        alerts:
            title: translate:vseo_alerts
        domain:
            title: translate:vseo_domain
            subpages:
                history:
                    title: translate:vseo_history
                compare:
                    title: translate:vseo_compare
                lost:
                    title: translate:vseo_lost
                technical:
                    title: translate:vseo_technical
                matomo:
                    title: Matomo
        settings:
            title: translate:vseo_settings
            perm: vseo[settings]
            subpages:
                domains:
                    title: translate:vseo_domains
                accounts:
                    title: translate:vseo_accounts
                general:
                    title: translate:vseo_general
                alerts:
                    title: translate:vseo_alert_rules
                core_updates:
                    title: translate:vseo_core_updates

console_commands:
    vseo:import: Viewsion\SeoMonitor\Command\ImportCommand
    vseo:backfill: Viewsion\SeoMonitor\Command\BackfillCommand
    vseo:aggregate: Viewsion\SeoMonitor\Command\AggregateCommand
    vseo:crawl: Viewsion\SeoMonitor\Command\CrawlCommand
    vseo:alerts: Viewsion\SeoMonitor\Command\AlertsCommand

default_config:
    data_state: final
    reload_days: 5
    backfill_months: 16
    run_budget: 45
    row_limit: 25000
    retention_months: 25
    crawl_per_run: 200
    crawl_interval_days: 7
    crawl_delay_ms: 250
    crawl_timeout: 15
    crawl_max_sitemap_urls: 50000
    crawl_gsc_days: 90
    inspect_per_day: 50
    inspect_interval_days: 14
    matomo_backfill_days: 90
    matomo_404_source: title
    matomo_404_pattern: '404'
    digest_weekday: 1
    alert_emails: ''

requires:
    redaxo: '^5.16.0'
    php:
        version: '>=8.1'
        extensions: [openssl, sodium, json, dom, xmlreader]

installer_ignore:
    - .DS_Store
    - .git
    - .github
    - .gitignore
    - CLAUDE.md
    - phpstan.neon
    - node_modules
